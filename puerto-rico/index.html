<html lang="en"><head><meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<script>
/* ============================================================
   EDIT YOUR TITLES HERE.
   One entry per photo, in display order. "title" is the label
   shown under each image. Change it to whatever you want, then
   save and refresh the page. The title updates everywhere
   (caption + alt text) automatically.

   Photos are split into two columns in order: the 1st goes to
   the LEFT column, 2nd to the RIGHT, 3rd LEFT, and so on.
   ============================================================ */
const PHOTOS = [
  { src: "images/beautiful_game.png", title: "FOOTY" },
  { src: "images/billow.png",         title: "Billow" },
  { src: "images/cute.png",           title: "awwWW" },
  { src: "images/god_rays.png",       title: "God Rays" },
  { src: "images/horsey.png",         title: "Horsey" },
  { src: "images/horsey2.png",        title: "Horsey II" },
  { src: "images/icecream_death.png", title: "We're out of Ice Cream" },
  { src: "images/swell.png",          title: "Swell" },
  { src: "images/wrestle.png",        title: "WAS it really 4 years ago?" },
  // ---- newly added photos (placeholder titles — rename these) ----
  // rot: "cw" = rotate right 90°, "ccw" = rotate left 90°
  { src: "images/capital.jpeg",       title: "Capital",     rot: "cw" },
  { src: "images/celebration.jpeg",   title: "Celebration" },
  { src: "images/delancey.jpeg",      title: "Delancey",    rot: "ccw" },
  { src: "images/hand.jpeg",          title: "Hand" },
  { src: "images/ring.jpeg",          title: "Ring" },
  { src: "images/tab.jpeg",           title: "Tab",         rot: "ccw" },
];
</script>

<style>
  :root {
    --paper: #f4f2ec;
    --ink: #16150f;
    --mut: #b3aea1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- fixed top bar ---- */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 26px 34px;
    z-index: 30;
    pointer-events: none;
  }
  header .back {
    font-weight: 700;
    font-size: 22px;
    letter-spacing: .5px;
    text-decoration: none;
    color: var(--ink);
    text-transform: uppercase;
    pointer-events: auto;
  }
  header .meta {
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #6b6b6b;            /* readable against the black right column */
    text-align: right;
    line-height: 1.5;
  }

  /* ---- the two fixed columns ---- */
  .split {
    position: fixed;
    inset: 0;
    display: flex;
    z-index: 1;
  }
  .col {
    width: 50%;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }
  .col.left  { background: var(--paper); }
  .col.right { background: #000; }

  .inner {
    padding: 16vh 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14vh;
    will-change: transform;
  }

  figure.shot { margin: 0; display: flex; flex-direction: column; align-items: center; }
  .shot img {
    display: block;
    max-width: 82%;
    max-height: 74vh;
    width: auto;
    height: auto;
  }
  .shot img.rot-cw  { transform: rotate(90deg); }
  .shot img.rot-ccw { transform: rotate(-90deg); }
  .shot img.rot-180 { transform: rotate(180deg); }  /* box unchanged, no reserve needed */
  /* When rotated 90°, the original WIDTH becomes the visual HEIGHT, so
     cap width to keep it inside the viewport (desktop only). */
  @media (min-width: 861px) {
    .shot img.rot-cw, .shot img.rot-ccw { max-width: 60vh; max-height: 40vw; }
  }
  .shot .label {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 16px;
    text-align: center;
  }
  .left  .shot .label { color: var(--ink); }
  .right .shot .label { color: #f4f2ec; }

  /* the spacer gives the page its scrollable height (columns are fixed) */
  .spacer { width: 100%; }

  /* ---- phones: forget the split, just stack everything normally ---- */
  @media (max-width: 860px) {
    header { padding: 18px 20px; }
    header .back { font-size: 18px; }
    .split {
      position: static;
      flex-direction: column;
      height: auto;
    }
    .col {
      width: 100%;
      height: auto;
      overflow: visible;
    }
    .inner {
      transform: none !important;
      padding: 90px 20px 20vh;
      gap: 12vh;
    }
    .right .inner { padding-top: 12vh; }
    .shot img { max-width: 100%; max-height: none; }
    .spacer { display: none; }
  }
</style>
</head>
<body>

<header>
  <a class="back" href="../">&larr;&nbsp;Home</a>
  <div class="meta">Puerto Rico<br>35mm &mdash; Spring 2022</div>
</header>

<div class="split">
  <div class="col left"><div class="inner" id="inner-left"></div></div>
  <div class="col right"><div class="inner" id="inner-right"></div></div>
</div>
<div class="spacer" id="spacer"></div>

<script>
  const innerLeft  = document.getElementById('inner-left');
  const innerRight = document.getElementById('inner-right');
  const spacer     = document.getElementById('spacer');

  // Split photos across the two columns (alternating).
  function figure(p) {
    const shot = document.createElement('figure');
    shot.className = 'shot';
    const rotClass = p.rot === 'cw' ? ' rot-cw' : p.rot === 'ccw' ? ' rot-ccw' : p.rot === '180' ? ' rot-180' : '';
    shot.innerHTML =
      '<img class="shot-img' + rotClass + '" src="' + p.src + '" alt="' + p.title + '" loading="lazy">' +
      '<figcaption class="label">' + p.title + '</figcaption>';
    return shot;
  }

  // A rotated image keeps its ORIGINAL (unrotated) box in the layout, so a
  // landscape photo turned portrait pokes past its box. Reserve the extra
  // vertical space with margin = (renderedWidth - renderedHeight) / 2.
  function fixRotation(img) {
    if (!img.classList.contains('rot-cw') && !img.classList.contains('rot-ccw')) return;
    const w = img.clientWidth, h = img.clientHeight;
    const extra = (w - h) / 2;
    img.style.margin = (extra > 0 ? extra : 0) + 'px 0';
  }
  PHOTOS.forEach((p, i) => {
    (i % 2 === 0 ? innerLeft : innerRight).appendChild(figure(p));
  });

  const isMobile = () => window.matchMedia('(max-width: 860px)').matches;

  let leftTravel = 0, rightTravel = 0;

  // Measure how far each column can move, and set the page scroll height.
  function recompute() {
    if (isMobile()) {
      spacer.style.height = '0px';
      innerLeft.style.transform = '';
      innerRight.style.transform = '';
      return;
    }
    const vh = window.innerHeight;
    leftTravel  = Math.max(0, innerLeft.offsetHeight  - vh);
    rightTravel = Math.max(0, innerRight.offsetHeight - vh);
    spacer.style.height = (vh + Math.max(leftTravel, rightTravel)) + 'px';
    onScroll();
  }

  // Left column travels DOWN as you scroll; right column travels UP.
  let ticking = false;
  function apply() {
    ticking = false;
    if (isMobile()) return;
    const y = window.scrollY;
    const leftY  = -leftTravel + Math.min(y, leftTravel); // starts at bottom, moves down
    const rightY = -Math.min(y, rightTravel);             // starts at top, moves up
    innerLeft.style.transform  = 'translateY(' + leftY + 'px)';
    innerRight.style.transform = 'translateY(' + rightY + 'px)';
  }
  function onScroll() {
    if (!ticking) { ticking = true; requestAnimationFrame(apply); }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', recompute);
  window.addEventListener('load', recompute);
  // Recompute as images finish loading (their heights change the totals).
  document.querySelectorAll('.shot img').forEach(img => {
    img.addEventListener('load', () => { fixRotation(img); recompute(); });
  });
  // Re-run rotation math on resize (vw/vh caps change the rendered size).
  window.addEventListener('resize', () => {
    document.querySelectorAll('.shot img').forEach(fixRotation);
    recompute();
  });
  recompute();
</script>
